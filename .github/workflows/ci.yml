# CI for the DAKP rebuild. Modeled on ../Tablassert/.github/workflows/ci.yml: aggressive caching +
# fully parallel jobs (no `needs:` between them, so they fan out at once). Every check is a
# Makefile target (local `make check` runs the same gate), so local and CI cannot drift:
#
#   python-lint   make lint + make fmt-check (gofmt needs a Go toolchain, hence setup-go)
#   python-type   make typecheck
#   python-test   make test (addopts adds `-n auto`; pytest-cov combines per-xdist-worker
#                 coverage so the 100% branch gate in pyproject.toml still holds)
#   go            make test-go + make vet
#   pre-commit    make precommit (validates the contributor hook wiring)
#
# Caching is keyed on lockfiles so it invalidates exactly when dependencies change:
#   - astral-sh/setup-uv caches the uv download/wheel cache, keyed on uv.lock.
#   - actions/setup-go caches the Go build + module cache, keyed on go/go.sum.
#   - actions/cache caches pre-commit's hook environments, keyed on .pre-commit-config.yaml.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The typecheck/test jobs install the `ci` group (test + typecheck) EXACTLY, so they share one
  # warm uv cache instead of racing to save mutually-useless ones; the lint and pre-commit jobs
  # sync the `dev` group instead (ruff/pre-commit live there). See the groups in pyproject.toml.
  SYNC_ARGS: --no-default-groups --group ci
  # Makefile targets run tools via `uv run`, which would otherwise top the env up to the default
  # (dev) group. Pinning `uv run` to whatever the sync step installed keeps each job's env exact
  # and the `uv run` itself a no-op (inexact sync: installs nothing, removes nothing).
  UV_NO_DEFAULT_GROUPS: "1"

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
          cache-suffix: dev
      # `make lint` runs ruff through the project env, so this job syncs the dev group (ruff
      # lives there, not in `ci`) instead of running ruff standalone via ruff-action.
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      # The gofmt check inside `make fmt-check` needs a Go toolchain; no compilation happens,
      # so the setup-go build/module cache is off.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Lint and format check
        run: make lint fmt-check

  python-type:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
          cache-suffix: ci
      - name: Sync dependencies
        run: uv sync --frozen ${{ env.SYNC_ARGS }}
      - name: Pyright
        run: make typecheck

  python-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
          cache-suffix: ci
      - name: Sync dependencies
        run: uv sync --frozen ${{ env.SYNC_ARGS }}
      # addopts supplies `-n auto --cov`; pytest-cov merges the per-worker .coverage files and the
      # fail_under=100 branch gate (pyproject.toml) fails the job on any regression.
      - name: Run tests (parallel, with coverage gate)
        run: make test

  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum
      # The Makefile targets `cd go` themselves, so make runs from the repo root.
      - name: Go test and vet
        run: make test-go vet

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
          cache-suffix: dev
      - name: Sync dev dependencies
        run: uv sync --frozen --group dev
      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: make precommit
