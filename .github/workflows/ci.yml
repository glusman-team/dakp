# CI for the DAKP rebuild. Modeled on ../Tablassert/.github/workflows/ci.yml: aggressive caching +
# fully parallel jobs (the checks fan out at once; only the python-test aggregate waits on its
# shards). Every check is a Makefile target (local `make check` runs the same gate), so local and
# CI cannot drift:
#
#   python-lint                          make lint + make fmt-check (gofmt needs a Go toolchain,
#                                        hence setup-go)
#   python-type                          make typecheck
#   python-test (unit) +                 the two `make test` phases run CONCURRENTLY on separate
#   python-test (integration)            runners, each writing its own coverage data file
#   python-test                          aggregate: downloads both shards' coverage artifacts,
#                                        combines them, and enforces the single combined
#                                        fail_under=90 gate (the Makefile `test` target stays the
#                                        sequential local equivalent; see it for why integration
#                                        must not run under xdist)
#   go                                   make test-go + make vet
#   pre-commit                           make precommit (validates the contributor hook wiring)
#
# Caching is keyed on lockfiles so it invalidates exactly when dependencies change:
#   - astral-sh/setup-uv caches the uv download/wheel cache, keyed on uv.lock.
#   - actions/setup-go caches the Go build + module cache, keyed on go/go.sum.
#   - actions/cache caches pre-commit's hook environments, keyed on .pre-commit-config.yaml.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The typecheck/test jobs install the `ci` group (test + typecheck) EXACTLY, so they share one
  # warm uv cache instead of racing to save mutually-useless ones; the lint and pre-commit jobs
  # sync the `dev` group instead (ruff/pre-commit live there). See the groups in pyproject.toml.
  SYNC_ARGS: --no-default-groups --group ci
  # Makefile targets run tools via `uv run`, which would otherwise top the env up to the default
  # (dev) group. Pinning `uv run` to whatever the sync step installed keeps each job's env exact
  # and the `uv run` itself a no-op (inexact sync: installs nothing, removes nothing).
  UV_NO_DEFAULT_GROUPS: "1"

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
          cache-suffix: dev
      # `make lint` runs ruff through the project env, so this job syncs the dev group (ruff
      # lives there, not in `ci`) instead of running ruff standalone via ruff-action.
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      # The gofmt check inside `make fmt-check` needs a Go toolchain; no compilation happens,
      # so the setup-go build/module cache is off.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Lint and format check
        run: make lint fmt-check

  python-type:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
          cache-suffix: ci
      - name: Sync dependencies
        run: uv sync --frozen ${{ env.SYNC_ARGS }}
      - name: Pyright
        run: make typecheck

  python-test-shard:
    name: python-test (${{ matrix.phase }})
    runs-on: ubuntu-latest
    # The two-phase suite is a ~1 min baseline; a wedged run should fail loudly at 30 min
    # (faulthandler_timeout dumps the stuck test's stack at 10 min) instead of silently
    # burning runner time. The 15 min cap used to cancel healthy jobs on slow-runner days:
    # checkout + uv sync alone can eat 6+ min, leaving no headroom for the ~1-2 min suite.
    timeout-minutes: 30
    strategy:
      # Both shards always run to completion so a failure in one never hides the other's
      # result (or its coverage artifact) behind a cancelled sibling.
      fail-fast: false
      matrix:
        phase: [unit, integration]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
          cache-suffix: ci
      - name: Sync dependencies
        run: uv sync --frozen ${{ env.SYNC_ARGS }}
      # Phase commands mirror the Makefile `test` target (addopts supplies
      # `-q -n auto --cov=dakp_pipeline`): unit fans out under xdist, integration runs
      # sequentially (`-n 0`) because xdist + spawned NER/tablassert subprocesses deadlocked.
      # Unlike the Makefile there is no `--cov-append`: each shard is a fresh workspace with a
      # single phase. `--cov-fail-under=0` defers the fail_under=90 gate (pyproject.toml) to
      # the aggregate python-test job, since one phase's data alone cannot clear the gate
      # that the COMBINED data must clear.
      - name: Run unit tests (parallel, coverage shard)
        if: matrix.phase == 'unit'
        run: uv run pytest tests/unit --cov-fail-under=0
      - name: Run integration tests (sequential, coverage shard)
        if: matrix.phase == 'integration'
        run: uv run pytest tests/integration -n 0 --cov-fail-under=0
      # `.coverage` is a hidden file, dropped by default since upload-artifact v4; without
      # `include-hidden-files` the upload would silently carry zero files. Upload only on
      # success: a failed shard has no coverage worth combining. `if-no-files-found: error`
      # turns any other missing-data case into a loud shard failure.
      - name: Upload shard coverage data
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.phase }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error

  # Aggregate check deliberately keeps the historical `python-test` job name: branch
  # protection required checks match on check-run names, and this job is the one that now
  # reports `python-test` (the shards report `python-test (unit)` / `python-test
  # (integration)`). `!cancelled()` + the explicit fail step mean a failed or skipped shard
  # turns THIS required check red, instead of leaving a gray skipped check that can silently
  # satisfy nothing.
  python-test:
    name: python-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [python-test-shard]
    if: ${{ !cancelled() }}
    steps:
      - name: Fail if any test shard did not pass
        if: needs.python-test-shard.result != 'success'
        run: |
          echo "python-test shard result: ${{ needs.python-test-shard.result }}"
          exit 1
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
          cache-suffix: ci
      # Without merge-multiple, each artifact extracts into its own named directory under
      # `path`, so the two shards' identically named `.coverage` files cannot overwrite each
      # other. download-artifact fails if the pattern matches nothing.
      - name: Download shard coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-data
      # `coverage combine` merges the shards' data files; `coverage report` re-reads
      # pyproject.toml, so the fail_under=90 branch gate over source=src/dakp_pipeline is
      # enforced on the COMBINED data exactly as the old single-job `make test` gate was.
      # Paths match across runners because ubuntu-latest checkouts land at the identical
      # /home/runner/work/<repo>/<repo> path (pyproject does not set relative_files).
      # The shards' files are passed as EXPLICIT paths, not directories: `coverage combine
      # <dir>` only picks up parallel-mode `.coverage.*` suffixed files and ignores a bare
      # `.coverage` inside the directory (verified: "No data to combine").
      - name: Combine shards and enforce the combined coverage gate
        run: |
          COVERAGE_VERSION=$(python3 -c 'import tomllib; lock = tomllib.load(open("uv.lock", "rb")); print(next(p["version"] for p in lock["package"] if p["name"] == "coverage"))')
          uvx --from "coverage==$COVERAGE_VERSION" coverage combine coverage-data/coverage-unit/.coverage coverage-data/coverage-integration/.coverage
          uvx --from "coverage==$COVERAGE_VERSION" coverage report

  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum
      # The Makefile targets `cd go` themselves, so make runs from the repo root.
      - name: Go test and vet
        run: make test-go vet

  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
          cache-suffix: dev
      - name: Sync dev dependencies
        run: uv sync --frozen --group dev
      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: make precommit
