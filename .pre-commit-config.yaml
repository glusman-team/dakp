# Two stages, matching ../Tablassert/.pre-commit-config.yaml:
#
# pre-commit -- fast, auto-fixing checks only. Committing must stay cheap.
# pre-push   -- the whole-repo gates that most often break CI (pyright, pytest). These run
#               once per push instead of once per commit, so they catch a red build before
#               it reaches a PR without taxing the edit/commit loop.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff pin resolved in uv.lock, which CI reads via `version-file`.
    rev: v0.16.0
    hooks:
      # No `files:` filter: CI runs `ruff check .` over the whole tree, so scoping these to
      # src/ and tests/ would let anything outside them only ever fail in CI.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      # Catches a pyproject.toml edit that was never relocked -- otherwise the failure
      # surfaces much later, as a confusing `uv sync --frozen` error in CI.
      - id: uv-lock-check
        name: uv-lock-check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        stages: [pre-push]
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        stages: [pre-push]
