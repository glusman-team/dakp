[project]
name = "dakp-pipeline"
version = "0.1.0"
description = "Drug Approvals Knowledge Provider (DAKP) rebuild: reproducible, content-addressed pipeline producing DailyMed / Drugs@FDA / FAERS / MEDI treatment and contraindication assertion tables for Tablassert."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ISB", email = "software@isbscience.org" }]
license = { text = "Apache-2.0" }
keywords = [
    "knowledge graph",
    "ncats translator",
    "drug approvals",
    "dailymed",
    "faers",
    "etl pipeline",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Runtime dependencies (see plans/airflow-native-go-workers.md). Airflow 3 is now a HARD
# dependency: the pipeline is Airflow-native (the DAG is the only orchestrator and the Go
# extractors run as native Airflow Go SDK bundle workers). `uv sync` installs the core runtime;
# `uv sync --all-extras` (or `make install`) adds the heavy NER + Tablassert backends needed for
# a full production run in one go.
dependencies = [
    "apache-airflow>=3,<4",
    "blake3>=1.0.0",
    "loguru>=0.7.3",
    "pendulum>=3",
    "polars>=1.30.0",
    "pydantic>=2.12.0",
]

[project.optional-dependencies]
# Biomedical NER backend (GLiNER zero-shot — the production half of the single composite
# DiseaseNER) is optional and HEAVY (pulls torch/transformers): `uv sync --extra ner`. The base
# install and the whole test suite run WITHOUT this extra: the offline gazetteer mode is
# deterministic and dep-free, and `dakp_pipeline.ner.ner` imports gliner lazily, raising
# NERDependencyError("install the [ner] extra") only when production mode runs without it.
ner = [
    "gliner>=0.1.15",
    "huggingface_hub>=0.24",
]
# Tablassert KG build is optional: `uv sync --extra kg`. The base install and the whole test
# suite run WITHOUT it (the mock profile + MockTablassertRunner never touch Tablassert, exactly
# like airflow/ner). `dakp_pipeline.tablassert.run` shells out to the INSTALLED `tablassert`
# CLI and raises "install the [kg] extra" only when a real (non-mock) handoff runs without it.
kg = [
    "tablassert>=8.0.0",
]
# Adds the embedding-based `tablassert build-kg --qc` audit (scikit-learn + sentence-transformers;
# pulls torch — HEAVY, for beefy hosts like wenceslaus): `uv sync --extra kg-qc`. Laptop builds
# use plain [kg]; the runner appends `--qc` only when this runtime is importable.
kg-qc = [
    "tablassert[qc]>=8.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyright>=1.1.411",
    "pytest>=9.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dakp_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: tests that require internet access"]

[tool.coverage.run]
source = ["src/dakp_pipeline"]
branch = true

[tool.coverage.report]
fail_under = 100
precision = 1
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise NotImplementedError",
    "raise AssertionError",
    "\\.\\.\\.",
    "@overload",
    # Airflow @task bodies only execute inside an Airflow runtime (optional dep, not
    # installed in CI); the underlying stage callables are tested directly instead.
    "def _airflow_only",
]

[tool.ruff]
line-length = 150
indent-width = 4
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [
    # Legacy Perl/Python source kept only for audit (PLAN.md "reuse" / "ref/legacy").
    # The new DAG never imports them; ruff/pyright must not lint them.
    "bin",
    "DailyMed",
    "DrugsFDA",
    "FAERS",
    "HPO",
    "MONDO",
    "matrix",
    "ref",
    "data",
    "tmp",
]

[tool.ruff.lint]
select = [
    "E4",  # pycodestyle E4xx
    "E7",  # pycodestyle E7xx
    "E9",  # pycodestyle E9xx
    "F",   # pyflakes
    "RUF100", # stale noqa
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific
    "TID", # flake8-tidy-imports
    "I",   # isort
    "PIE", # flake8-pie
    "RET", # flake8-return
    "UP",  # pyupgrade
]
ignore = [
    "E731",  # allow lambda assignments (used in monkeypatchable stubs / tests)
]

[tool.ruff.lint.isort]
# Align with `format.skip-magic-trailing-comma = true` (avoids ruff incompatibility warning).
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.pyright]
include = ["src", "tests"]
exclude = ["data", "tmp", ".venv"]
pythonVersion = "3.12"
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
reportDuplicateImport = true
