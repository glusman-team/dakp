[project]
name = "dakp-pipeline"
version = "0.1.0"
description = "Drug Approvals Knowledge Provider (DAKP) rebuild: reproducible, content-addressed pipeline producing DailyMed / Drugs@FDA / FAERS / MEDI treatment and contraindication assertion tables for Tablassert."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ISB", email = "software@isbscience.org" }]
license = { text = "Apache-2.0" }
keywords = [
    "knowledge graph",
    "ncats translator",
    "drug approvals",
    "dailymed",
    "faers",
    "etl pipeline",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Runtime dependencies (see plans/airflow-native-go-workers.md). Everything the pipeline needs
# is a HARD dependency installed by ONE command (`uv sync`, or `make install`) — there are no
# optional extras. Airflow 3 is the only orchestrator (the DAG drives the pipeline and the Go
# extractors run as native Airflow Go SDK bundle workers); the biomedical NER backend (GLiNER
# zero-shot) and the Tablassert KG build are required for a full production run. `gliner` is
# still imported lazily (no torch at module load) and the mock profile + tests never touch the
# network or Tablassert, but a single `uv sync` now materializes the whole production runtime.
# Tablassert is pinned to the `[qc]` variant because the KG build needs the embedding-based
# `tablassert build-kg --qc` audit (sentence-transformers).
dependencies = [
    "apache-airflow>=3,<4",
    "blake3>=1.0.0",
    "cyclopts>=4",
    "gliner>=0.1.15",
    "huggingface_hub>=0.24",
    "loguru>=0.7.3",
    "pendulum>=3",
    "polars>=1.30.0",
    "pydantic>=2.12.0",
    "tablassert[qc]>=8.0.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyright>=1.1.411",
    "pytest>=9.0.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.6",
]

[project.scripts]
dakp = "dakp_pipeline.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dakp_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-n auto` runs the suite in parallel across all cores via pytest-xdist (pytest-cov combines the
# per-worker coverage data, so the 100% branch gate below still holds). `--cov` is baked in so the
# fail_under gate runs on every invocation. Heavy imports (Airflow) are deferred to fixtures so
# per-worker collection stays cheap (see tests/unit/conftest.py).
addopts = "-q -n auto --cov"
markers = ["network: tests that require internet access"]

[tool.coverage.run]
source = ["src/dakp_pipeline"]
branch = true

[tool.coverage.report]
fail_under = 100
precision = 1
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise NotImplementedError",
    "raise AssertionError",
    "\\.\\.\\.",
    "@overload",
    # Airflow @task bodies only execute inside an Airflow runtime (optional dep, not
    # installed in CI); the underlying stage callables are tested directly instead.
    "def _airflow_only",
]

[tool.ruff]
line-length = 150
indent-width = 4
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [
    # Generated runtime workdirs (pipeline output + scratch); never lint them.
    "data",
    "tmp",
]

[tool.ruff.lint]
select = [
    "E4",  # pycodestyle E4xx
    "E7",  # pycodestyle E7xx
    "E9",  # pycodestyle E9xx
    "F",   # pyflakes
    "RUF100", # stale noqa
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific
    "TID", # flake8-tidy-imports
    "I",   # isort
    "PIE", # flake8-pie
    "RET", # flake8-return
    "UP",  # pyupgrade
]
ignore = [
    "E731",  # allow lambda assignments (used in monkeypatchable stubs / tests)
]

[tool.ruff.lint.isort]
# Align with `format.skip-magic-trailing-comma = true` (avoids ruff incompatibility warning).
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.pyright]
include = ["src", "tests"]
exclude = ["data", "tmp", ".venv"]
pythonVersion = "3.12"
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
reportDuplicateImport = true
