  provenance:
    override:
      sources:
        - resource_id: "infores:multiomics-drugapprovals"
          resource_role: primary_knowledge_source
          upstream_resource_ids:
            - "infores:dailymed"
            - "infores:faers"
          source_record_urls:
            - "https://db.systemsbiology.net/gestalt/cgi-pub/KGinfo.pl?id={edge_id}"
        - resource_id: "infores:faers"
          resource_role: supporting_data_source
        - resource_id: "infores:dailymed"
          resource_role: supporting_data_source
      knowledge_level: knowledge_assertion
      agent_type: manual_validation_of_automated_agent
  annotations:
    - annotation: FDA_regulatory_approvals
      method: column
      encoding: J
      split_by: "|"
    - annotation: has_evidence
      method: column
      encoding: S
      split_by: "|"
    - annotation: clinical_approval_status
      method: column
      encoding: N
