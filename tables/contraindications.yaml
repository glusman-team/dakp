template:
  source:
    kind: text
    local: data/tabular/contraindication_assertions.tsv
    url: "https://example.invalid/dakp/generated/contraindication_assertions.tsv"
    delimiter: "\t"
  statement:
    subject:
      method: column
      encoding: A
      prioritize:
        - Drug
        - SmallMolecule
        - ChemicalEntity
    predicate: contraindicated_in
    # Object = the mined disease MENTION TEXT (object_text, encoding F). DAKP does NOT resolve
    # ontology CURIEs: object_curie/name/category (G/H/I) are intentionally empty, and
    # Tablassert/fullmap resolves the mention text to a CURIE + category at `tablassert build-kg`.
    object:
      method: column
      encoding: F
      prioritize:
        - Disease
        - PhenotypicFeature
  provenance:
    override:
      infores: "infores:multiomics-drugapprovals"
      upstream_resource_ids:
        - "infores:dailymed"
      knowledge_level: knowledge_assertion
      agent_type: text_mining_agent
  annotations:
    - annotation: supporting_spl_sets
      method: column
      encoding: J
    - annotation: supporting_spl_documents
      method: column
      encoding: K
    - annotation: source_score
      method: column
      encoding: L
